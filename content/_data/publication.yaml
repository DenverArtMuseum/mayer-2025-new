# Title & Description
title: Maya Women
subtitle: Past, Present, Future
reading_line:
short_title:

description:
  one_line:
  full: "The 24th Annual Mayer Center Symposium centered Maya women, past and present, as essential producers of art, culture, and economy while asserting female visibility and fighting against cultural erasure. This symposium volume brings together essays, conversations, and poetry by scholars, poets, curators, and activists."

